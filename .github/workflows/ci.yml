name: Cloud Data Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  RUFF_VERSION: '0.1.15'

defaults:
  run:
    shell: bash

jobs:
  ingestion-tests:
    name: Ingestion lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - name: Install dependencies
        working-directory: ingestion
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "ruff==${RUFF_VERSION}"
      - name: Lint
        working-directory: ingestion
        run: ruff check src/
      - name: Test with coverage
        working-directory: ingestion
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

  dbt-validate:
    name: dbt compile and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dbt
        run: |
          python -m pip install dbt-core==1.7.6 dbt-postgres==1.7.6
          python -m pip install "protobuf<5"
      - name: Validate dbt project
        working-directory: dbt
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        run: |
          dbt parse --profiles-dir .
          dbt compile --profiles-dir .

  docker-build:
    name: Docker builds
    needs: [ingestion-tests, dbt-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ingestion image
        uses: docker/build-push-action@v7
        with:
          context: ./ingestion
          push: false
          tags: cloud-data-platform-ingestion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard
          push: false
          tags: cloud-data-platform-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
