version: 2
updates:
  - package-ecosystem: pip
    directory: /ingestion
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
