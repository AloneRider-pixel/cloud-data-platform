version: "3.9"

services:
  # ─── PostgreSQL (Data Warehouse) ───
  postgres:
    image: postgres:16-alpine
    container_name: data-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_platform}
      POSTGRES_USER: ${POSTGRES_USER:-data_engineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/schemas:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_engineer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible Storage) ───
  minio:
    image: minio/minio:latest
    container_name: data-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── MinIO Bucket Setup ───
  minio-setup:
    image: minio/mc:latest
    container_name: data-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD";
      mc mb local/raw-data-lake --ignore-existing;
      mc mb local/clean-data --ignore-existing;
      mc mb local/analytics-data --ignore-existing;
      mc anonymous set none local/raw-data-lake;
      echo 'Buckets created successfully';
      "

  # ─── Mock API (Data Source) ───
  mock-api:
    build:
      context: ./scripts
      dockerfile: Dockerfile.mockapi
    container_name: data-mock-api
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  # ─── Data Ingestion Service ───
  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: data-ingestion
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - S3_ENDPOINT=http://minio:9000
      - MOCK_API_BASE_URL=http://mock-api:8001
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mock-api:
        condition: service_started
    volumes:
      - ./ingestion/src:/app/src

  # ─── Apache Airflow ───
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: data-airflow-web
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://data_engineer:data_password@postgres:5432/data_platform
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - POSTGRES_HOST=postgres
      - S3_ENDPOINT=http://minio:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true &&
      airflow webserver --port 8080
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: data-airflow-scheduler
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://data_engineer:data_password@postgres:5432/data_platform
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - POSTGRES_HOST=postgres
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      airflow-webserver:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
    command: airflow scheduler

  # ─── dbt ───
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: data-dbt
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dbt:/usr/app/dbt
    command: ["run", "--profiles-dir", "/root/.dbt"]

  # ─── Streamlit Dashboard ───
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: data-dashboard
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dashboard/src:/app/src
    command: streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres_data:
  minio_data:
