name: 'ecommerce_analytics'
version: '1.0.0'
config-version: 2

profile: 'ecommerce'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_analytics:
    +materialized: view
    +schema: analytics
    
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']
    
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      +tags: ['intermediate']
    
    analytics:
      +materialized: table
      +schema: analytics
      +tags: ['analytics']
      
      marts:
        +materialized: table
        +tags: ['mart']

seeds:
  ecommerce_analytics:
    +schema: seeds

tests:
  ecommerce_analytics:
    +severity: warn
